[package]
name = "gitea-automations-bridge"
description = "Bridge daemon between the Gitea shared board and the Hermes kanban execution fabric"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gitea-automations"
path = "src/main.rs"

[lib]
name = "bridge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "io-util", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
