# Upstream-sync blast-radius guard (issue #58, epic #53).
#
# Fails a pull request that touches a path reserved by the in-flight upstream
# sync cherry-picks (#43-#51) while tracker issue #43 is open.
#
# Exemption: a PR that IS part of the sync (the B1-B5 picks, the #43/#51
# artefact PRs, and maintenance of the guard itself) is expected to touch the
# reserved paths. Label it `sync-owner` and the enforcement step is skipped,
# with the exemption logged on the run so it is distinguishable from a pass.
#
# Enforcement strength: the guard is a mechanical CI check, not branch
# protection (explicitly out of scope for #58). It runs the BASE ref's copy of
# .terraphim/check-blast-radius.sh, .terraphim/blast-radius-diff.sh and
# .terraphim/sync-blast-radius.txt, so a PR cannot neuter the check by editing
# its own tree - but the first PR to introduce those files, and any change to
# them once merged, is only as strong as the review of .terraphim/.
name: Blast radius guard
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: blast-radius-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # keep in sync with the literal in the two `if:` conditions below - the env
  # context is not reliably available to step conditions on act_runner
  GUARD_EXEMPT_LABEL: sync-owner

jobs:
  check-blast-radius:
    name: Upstream-sync blast radius
    runs-on: terraphim-native
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pin guard sources to the base ref
        id: pin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ -z "$BASE_SHA" ]; then
            echo "pull_request.base.sha missing from the event payload" >&2
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$BASE_SHA" 2>/dev/null || true
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "cannot resolve base rev ${BASE_SHA}; the checkout needs the base history" >&2
            exit 1
          fi

          guard_dir="${RUNNER_TEMP}/blast-radius-guard"
          mkdir -p "$guard_dir"
          for f in check-blast-radius.sh blast-radius-diff.sh sync-blast-radius.txt; do
            if git show "${BASE_SHA}:.terraphim/${f}" > "${guard_dir}/${f}" 2>/dev/null; then
              echo "pinned .terraphim/${f} from base ${BASE_SHA}"
            elif [ -f ".terraphim/${f}" ]; then
              # only reachable while the guard itself is being introduced
              cp ".terraphim/${f}" "${guard_dir}/${f}"
              echo "::warning::.terraphim/${f} does not exist on the base ref; using this PR's copy"
            else
              echo ".terraphim/${f} missing on both the base ref and this PR" >&2
              exit 1
            fi
          done
          echo "guard-dir=${guard_dir}" >> "$GITHUB_OUTPUT"

      - name: Collect changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GUARD_DIR: ${{ steps.pin.outputs.guard-dir }}
        run: |
          set -eu
          head_rev="HEAD"
          if [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            head_rev="$HEAD_SHA"
          fi
          # three-dot semantics: diff against the merge base, not the base tip
          bash "${GUARD_DIR}/blast-radius-diff.sh" \
            --base "$BASE_SHA" \
            --head "$head_rev" \
            --output changed-paths.txt
          echo "changed paths:"
          cat changed-paths.txt

      - name: Blast radius exemption
        if: ${{ contains(github.event.pull_request.labels.*.name, 'sync-owner') }}
        run: |
          echo "::warning::blast-radius guard EXEMPTED - this PR carries the '${GUARD_EXEMPT_LABEL}' label"
          echo "The guard was not enforced. This is the documented escape hatch for"
          echo "the upstream-sync PRs themselves (#43-#51) and for maintenance of the"
          echo "guard; the label on the PR is the audit record."

      - name: Enforce blast radius
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'sync-owner') }}
        env:
          GITEA_API_URL: ${{ github.server_url }}/api/v1
          GITEA_REPO: ${{ github.repository }}
          GITEA_API_TOKEN: ${{ github.token }}
          GUARD_ISSUE: "43"
          GUARD_DIR: ${{ steps.pin.outputs.guard-dir }}
        run: |
          bash "${GUARD_DIR}/check-blast-radius.sh" \
            --list "${GUARD_DIR}/sync-blast-radius.txt" \
            --changed changed-paths.txt
